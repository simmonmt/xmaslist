services:
  xmaslist:
    # Come back after a host reboot or Docker daemon restart, but stay
    # stopped after `docker/docker-compose-prod stop`.
    restart: unless-stopped
    ports:
      - target: 8080
        published: 3400
        protocol: tcp
    volumes:
      - type: volume
        source: xmaslist_database
        target: /db
      - type: volume
        read_only: true
        source: xmaslist_session_secret
        target: /secret

volumes:
  xmaslist_database:
    external: true
  xmaslist_session_secret:
    external: true
