version: "3.8"

services:
  xmaslist:
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ./dev_session_secret.txt
        target: /secret/session_secret.txt
      - type: bind
        source: "${XMASLIST_DATABASE}"
        target: /db/db.sqlite
