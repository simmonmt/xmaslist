# Browser (protobuf-es / connect-es) code generation. Output lands in
# client/gen/ as TypeScript and is not checked in. Run via `make gen`.
#
# protoc-gen-es comes from the @bufbuild/protoc-gen-es npm package. Its output
# includes the service descriptors that @connectrpc/connect's createClient uses.
version: v2
plugins:
  - local: node_modules/.bin/protoc-gen-es
    out: client/gen
    opt: [target=ts]
